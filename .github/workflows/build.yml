# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    paths: 
      - main.qmd
      - contents/*
      - .github/workflows/build.yml
      - README.qmd
  workflow_dispatch:

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quarto
            any::webshot2
            any::showtext
            any::ggplot2
            any::sysfonts
            any::tidyr
            any::bench
            any::ggbeeswarm
            any::ggtext
            any::svglite
            any::gt
            any::lobstr

      - name: Render Posters and README.md
        run: |
          quarto::quarto_render("main.qmd", quiet = FALSE)
          file.copy("main.html", "docs/index.html", overwrite = TRUE)
          unlink("main.html")
          dir.create("thumbs", showWarnings = FALSE, mode = "0755")
          webshot2::webshot(
            url = "docs/index.html",
            file = "thumbs/title-slide.png",
            vwidth = 1920,
            vheight = 1080
          )
          webshot2::webshot(
            url = "docs/index.html",
            file = "thumbs/title-slide-github.png",
            vwidth = 1280,
            vheight = 640
          )
          quarto::quarto_render("README.qmd", quiet = TRUE)
        shell: Rscript {0}

      - name: Open the pull request
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          merge: none
          allow-unchanged: true
          files: |
            docs
            thumbs
            README.md
          message: Automatic update of HTML file with latest Quarto
          branch: auto-detected-updates
